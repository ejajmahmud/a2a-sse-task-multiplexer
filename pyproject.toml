[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-sse-task-multiplexer"
version = "0.1.0"
description = "Aggregates and orders concurrent Server-Sent Events (SSE) task-status streams from multiple A2A peer agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
a2a-sse-task-multiplexer = "a2a_sse_task_multiplexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2a_sse_task_multiplexer*"]
